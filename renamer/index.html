<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="renamer_header">📝 File Renamer</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../tooltip.styles.css?v=3">
  <link rel="stylesheet" href="renamer.styles.css">
</head>
<body>

  <!-- Header -->
  <header class="tool-header">
    <h1 data-i18n="renamer_header">📝 File Renamer</h1>
    <p data-i18n="renamer_instructions">Select files, set rules, and click Rename.</p>
  </header>

  <!-- Back Home -->
  <div class="back-home-wrapper">
    <a href="https://grinder3011.github.io/isk/" class="back-home-link" data-i18n="common_backHome">← Back to Home</a>
  </div>

  <!-- Main Tool -->
  <main class="container">
    <div class="tool-wrapper">
      <div class="file-input">
        <label for="file-input" data-i18n="renamer_selectFiles">Select Files</label>
        <input type="file" id="file-input" multiple />
      </div>

      <h2 data-i18n="renamer_filenameRules">Filename Rules</h2>

      <div class="form-group">
        <label for="prefix" data-i18n="renamer_prefix">Prefix</label>
        <input type="text" id="prefix" placeholder="Example: photo_" />
      </div>

      <div class="form-group">
        <label for="suffix" data-i18n="renamer_suffix">Suffix</label>
        <input type="text" id="suffix" placeholder="Example: _edited" />
      </div>

      <div class="form-group">
        <label for="replace" data-i18n="renamer_replace">Replace Text</label>
        <input type="text" id="replace" placeholder="Find..." />
      </div>

      <div class="form-group">
        <label for="replace-with" data-i18n="renamer_with">With</label>
        <input type="text" id="replace-with" placeholder="Replace with..." />
      </div>

      <div class="form-group">
        <label data-i18n="renamer_preview">Preview Names</label>
        <div id="preview-area"></div>
      </div>

      <div class="actions">
        <button id="rename-btn" data-i18n="renamer_rename">📝 Rename</button>
        <button id="reset-btn" data-i18n="renamer_reset">🔄 Reset</button>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="../tooltip.js" defer></script>
  <script src="renamer.js" defer></script>
  <script src="../translations/i18n.js" defer></script>
</body>
</html>
